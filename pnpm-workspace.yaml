allowBuilds:
  esbuild: true
  sharp: false

# Name patterns (not name@version): the supply-chain verify gate matches the
# minimumReleaseAge exclude list by package name glob, so versioned entries are
# silently ignored. These are first-party/closely-tracked deps we deliberately
# adopt on release day.
minimumReleaseAgeExclude:
  - astro
  - "@astrojs/*"

# Transitive security floors (pnpm audit). @atproto/* still declares zod ^3,
# which has no patched release; revisit once it moves to zod 4.
overrides:
  fast-uri: ">=3.1.9"
  zod: ">=4.6.6"
  # eslint (via @e18e/eslint-plugin, eslint-plugin-perfectionist) and
  # @eslint/config-array pin minimatch ^10; GHSA minimatch globparts DoS.
  # Drop once they allow >=11.0.1.
  minimatch: ^11.0.1
